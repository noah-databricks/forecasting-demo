resources:
  jobs:
    forecasting_batch_inference:
      name: "[${bundle.target}] Store revenue batch forecast"
      description: Independently rerunnable batch deployment that scores the UC model alias.
      max_concurrent_runs: 1
      tasks:
        - task_key: configure
          spark_python_task:
            python_file: ../src/configure.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --source-catalog
              - ${var.source_catalog}
              - --source-schema
              - ${var.source_schema}
              - --forecast-horizon
              - ${var.forecast_horizon}
              - --experiment-path
              - /Users/${workspace.current_user.userName}/forecasting-demo/model-comparison
              - --registered-model-name
              - ${var.registered_model_name}
          environment_key: forecasting_environment

        - task_key: batch_score
          depends_on:
            - task_key: configure
          notebook_task:
            notebook_path: ../src/notebooks/02_batch_score.py
          environment_key: forecasting_environment
      environments:
        - environment_key: forecasting_environment
          spec:
            client: "4"
            dependencies:
              - statsforecast==2.0.3
              - pyarrow>=15,<22
              - matplotlib>=3.8,<4
              - seaborn>=0.13,<1
